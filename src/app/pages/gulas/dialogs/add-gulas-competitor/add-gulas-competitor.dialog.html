    <div class="dialog-content">
      <div class="dialog-header">
        <h2>
          <mat-icon color="primary">soup_kitchen</mat-icon>
          Dodaj kodno ime
        </h2>
      </div>

      <div class="form-group">
        <mat-form-field appearance="outline" style="width:100%">
          <mat-label>Kodno ime natjecatelja</mat-label>
          <input matInput [(ngModel)]="codeName" placeholder="npr. JELEN" (keyup.enter)="add()" />
          <mat-icon matSuffix>badge</mat-icon>
          <mat-hint>Naziv po kojem će suci ocjenjivati gulaš, bez stvarnog imena natjecatelja</mat-hint>
        </mat-form-field>
      </div>

      <div class="dialog-actions">
        <button mat-button (click)="close()">
          <mat-icon>close</mat-icon>
          Odustani
        </button>
        <button mat-raised-button
          color="primary"
          (click)="add()"
          [disabled]="!isFormValid()">
          <mat-icon>check</mat-icon>
          Dodaj
        </button>
      </div>
    </div>
